openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: images
    description: Site image slot management.
  - name: settings
    description: Site settings (company info, taglines, services list).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get site settings
      description: Returns the current site settings (company info, taglines, services list). Public endpoint.
      responses:
        "200":
          description: Current site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update site settings
      description: "Saves updated site settings. Requires admin session and the x-csrf-protection: 1 header."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /settings/reset:
    post:
      operationId: resetSettings
      tags: [settings]
      summary: Reset site settings to defaults
      description: "Resets all site settings to factory defaults. Requires admin session and the x-csrf-protection: 1 header."
      responses:
        "200":
          description: Default settings restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /images:
    get:
      operationId: getImages
      tags: [images]
      summary: Get all image slot assignments
      description: Returns all current slot to objectPath mappings.
      responses:
        "200":
          description: List of image slot assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImageSlot"
  /images/{slot}:
    post:
      operationId: setImageSlot
      tags: [images]
      summary: Save a new objectPath for a slot
      description: Saves or updates the image objectPath for a given slot.
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            type: string
          description: The image slot key (e.g. hero-bg, project-deck-restoration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetImageSlotRequest"
      responses:
        "200":
          description: Slot updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSlot"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. image/jpeg).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid).
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ImageSlot:
      type: object
      required: [slot, objectPath]
      properties:
        slot:
          type: string
          description: The image slot key.
        objectPath:
          type: string
          description: The object path for the image.
        uploadedAt:
          type: string
          format: date-time
    SetImageSlotRequest:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          description: The object path returned from the upload endpoint.
    SiteService:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          description: Service name (e.g. "Deck Repairs").
        description:
          type: string
          description: Short description of the service.
    SiteSettings:
      type: object
      required: [companyName, tagline1, tagline2, tagline3, phone, email, serviceArea, services]
      properties:
        companyName:
          type: string
          description: Business name shown in the navbar and footer.
        tagline1:
          type: string
          description: First hero tagline word/phrase.
        tagline2:
          type: string
          description: Second hero tagline word/phrase.
        tagline3:
          type: string
          description: Third hero tagline word/phrase.
        phone:
          type: string
          description: Contact phone number.
        email:
          type: string
          description: Contact email address.
        serviceArea:
          type: string
          description: Geographic service area description.
        services:
          type: array
          items:
            $ref: "#/components/schemas/SiteService"
          description: List of services offered.
